# ===========================================================================
# ShopStack 电商中台 —— 一键编排
# ---------------------------------------------------------------------------
# 启动中间件：  docker compose -f deploy/docker-compose.yml up -d mysql redis rabbitmq nacos
# 启动全部后端：docker compose -f deploy/docker-compose.yml up -d --build
# 查看状态：    docker compose -f deploy/docker-compose.yml ps
# 清理数据：    docker compose -f deploy/docker-compose.yml down -v
# ===========================================================================

name: shopstack

x-mysql-env: &mysql-env
  MYSQL_ROOT_PASSWORD: root123456
  MYSQL_DATABASE: shopstack
  MYSQL_USER: shopstack
  MYSQL_PASSWORD: shopstack
  TZ: Asia/Shanghai

x-app-env: &app-env
  SHOP_MYSQL_HOST: mysql
  SHOP_MYSQL_PORT: "3306"
  SHOP_MYSQL_USER: shopstack
  SHOP_MYSQL_PASSWORD: shopstack
  SHOP_MYSQL_DATABASE: shopstack
  SHOP_REDIS_ADDR: redis:6379
  SHOP_RABBITMQ_URL: amqp://shopstack:shopstack@rabbitmq:5672/
  SHOP_NACOS_ENABLED: "true"
  SHOP_NACOS_ADDR: nacos:8848
  SHOP_JWT_SECRET: shopstack-dev-secret-change-me
  SHOP_ADMIN_JWT_SECRET: shopstack-dev-admin-secret-change-me
  TZ: Asia/Shanghai

x-app-depends: &app-depends
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # -------------------------------------------------------------------------
  # 中间件
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shopstack-mysql
    restart: unless-stopped
    environment: *mysql-env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=500
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [shopstack]

  redis:
    image: redis:7-alpine
    container_name: shopstack-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [shopstack]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shopstack-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shopstack
      RABBITMQ_DEFAULT_PASS: shopstack
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [shopstack]

  nacos:
    # 注意：2.3.2 及更早版本没有 linux/arm64 镜像，Apple Silicon 上拉不下来，
    # 这里用支持 arm64 的 2.4.3。
    image: nacos/nacos-server:v2.4.3
    container_name: shopstack-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      PREFER_HOST_MODE: hostname
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8848/nacos/v1/console/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [shopstack]

  # -------------------------------------------------------------------------
  # 微服务
  # -------------------------------------------------------------------------
  user-service:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: user-service }
    container_name: shopstack-user-service
    restart: unless-stopped
    environment:
      <<: *app-env
      SHOP_SERVICE_NAME: user-service
    ports: ["9001:9001"]
    depends_on: *app-depends
    networks: [shopstack]

  product-service:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: product-service }
    container_name: shopstack-product-service
    restart: unless-stopped
    environment:
      <<: *app-env
      SHOP_SERVICE_NAME: product-service
    ports: ["9002:9002"]
    depends_on: *app-depends
    networks: [shopstack]

  cart-service:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: cart-service }
    container_name: shopstack-cart-service
    restart: unless-stopped
    environment:
      <<: *app-env
      SHOP_SERVICE_NAME: cart-service
    ports: ["9003:9003"]
    depends_on: *app-depends
    networks: [shopstack]

  order-service:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: order-service }
    container_name: shopstack-order-service
    restart: unless-stopped
    environment:
      <<: *app-env
      SHOP_SERVICE_NAME: order-service
    ports: ["9004:9004"]
    depends_on: *app-depends
    networks: [shopstack]

  payment-service:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: payment-service }
    container_name: shopstack-payment-service
    restart: unless-stopped
    environment:
      <<: *app-env
      SHOP_SERVICE_NAME: payment-service
    ports: ["9005:9005"]
    depends_on: *app-depends
    networks: [shopstack]

  inventory-service:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: inventory-service }
    container_name: shopstack-inventory-service
    restart: unless-stopped
    environment:
      <<: *app-env
      SHOP_SERVICE_NAME: inventory-service
    ports: ["9006:9006"]
    depends_on: *app-depends
    networks: [shopstack]

  marketing-service:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: marketing-service }
    container_name: shopstack-marketing-service
    restart: unless-stopped
    environment:
      <<: *app-env
      SHOP_SERVICE_NAME: marketing-service
    ports: ["9007:9007"]
    depends_on: *app-depends
    networks: [shopstack]

  logistics-service:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: logistics-service }
    container_name: shopstack-logistics-service
    restart: unless-stopped
    environment:
      <<: *app-env
      SHOP_SERVICE_NAME: logistics-service
    ports: ["9008:9008"]
    depends_on: *app-depends
    networks: [shopstack]

  notification-service:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: notification-service }
    container_name: shopstack-notification-service
    restart: unless-stopped
    environment:
      <<: *app-env
      SHOP_SERVICE_NAME: notification-service
    ports: ["9009:9009"]
    depends_on: *app-depends
    networks: [shopstack]

  # -------------------------------------------------------------------------
  # API 网关
  # -------------------------------------------------------------------------
  api-gateway:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { SERVICE: gateway }
    container_name: shopstack-api-gateway
    restart: unless-stopped
    environment:
      <<: *app-env
      SHOP_SERVICE_NAME: gateway
      SHOP_HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [shopstack]

networks:
  shopstack:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
