syntax = "proto3";

package shopstack.user.v1;

option go_package = "github.com/shopstack/platform/gen/go/user/v1;userv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "shopstack/common/v1/common.proto";

// ---------------------------------------------------------------------------
// 实体
// ---------------------------------------------------------------------------

message User {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string avatar = 4;
  string phone = 5;
  string email = 6;
  shopstack.common.v1.Gender gender = 7;
  string birthday = 8;
  int32 points = 9;   // 积分
  int64 balance_cents = 10; // 余额（分）
  shopstack.common.v1.UserStatus status = 11;
  string wechat_openid = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp last_login_at = 14;
  int32 level = 15; // 会员等级
  int32 growth = 16; // 成长值
  string real_name = 17; // 实名姓名
  int32 realname_status = 18; // 实名状态：0 未认证 1 已认证 2 审核中
}

message Admin {
  int64 id = 1;
  string username = 2;
  string real_name = 3;
  string avatar = 4;
  string email = 5;
  string phone = 6;
  repeated int64 role_ids = 7;
  repeated string role_names = 8;
  int32 status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp last_login_at = 11;
}

message Role {
  int64 id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
  repeated int64 permission_ids = 5;
  repeated string permission_codes = 6;
  int32 user_count = 7;
  google.protobuf.Timestamp created_at = 8;
}

message Permission {
  int64 id = 1;
  string name = 2;
  string code = 3;
  string group = 4;   // 分组：product / order / user / marketing / system
  string type = 5;   // menu | action
  string parent_code = 6;
  int32 sort = 7;
}

// ---------------------------------------------------------------------------
// 认证
// ---------------------------------------------------------------------------

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;   // 秒
  string token_type = 4;  // Bearer
  User user = 5;
  Admin admin = 6;
  repeated string permissions = 7; // 后台登录时返回权限码
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string phone = 3;
  string nickname = 4;
  string sms_code = 5;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message WeChatLoginRequest {
  string code = 1;       // wx.login 返回的临时 code
  string nickname = 2;
  string avatar = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

// ---------------------------------------------------------------------------
// 用户资料 / 地址 / 收藏
// ---------------------------------------------------------------------------

message GetProfileRequest {
  int64 user_id = 1;
}

message UpdateProfileRequest {
  int64 user_id = 1;
  string nickname = 2;
  string avatar = 3;
  string email = 4;
  shopstack.common.v1.Gender gender = 5;
  string birthday = 6;
}

message ListAddressesRequest {
  int64 user_id = 1;
}

message ListAddressesResponse {
  repeated shopstack.common.v1.Address addresses = 1;
}

message SaveAddressRequest {
  int64 user_id = 1;
  int64 id = 2;
  string receiver = 3;
  string phone = 4;
  string province = 5;
  string city = 6;
  string district = 7;
  string detail = 8;
  string postal_code = 9;
  string tag = 10;
  bool is_default = 11;
}

message DeleteAddressRequest {
  int64 user_id = 1;
  int64 id = 2;
}

message SetDefaultAddressRequest {
  int64 user_id = 1;
  int64 id = 2;
}

message ListFavoritesRequest {
  int64 user_id = 1;
  shopstack.common.v1.PageRequest page = 2;
}

message ListFavoritesResponse {
  repeated FavoriteProduct products = 1;
  shopstack.common.v1.PageMeta meta = 2;
}

message FavoriteProduct {
  int64 id = 1;
  int64 product_id = 2;
  string title = 3;
  string cover = 4;
  int64 price_cents = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ToggleFavoriteRequest {
  int64 user_id = 1;
  int64 product_id = 2;
}

message ToggleFavoriteResponse {
  bool favorited = 1;
}

// ---------------------------------------------------------------------------
// 积分明细与发票
// ---------------------------------------------------------------------------

message PointsLog {
  int64 id = 1;
  int64 user_id = 2;
  string title = 3;         // 变动说明
  int32 change = 4;         // 正数为增加，负数为减少
  int32 balance = 5;        // 变动后余额
  string biz_type = 6;      // register / order / exchange / admin
  string biz_id = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListPointsLogsRequest {
  int64 user_id = 1;
  shopstack.common.v1.PageRequest page = 2;
}

message ListPointsLogsResponse {
  repeated PointsLog logs = 1;
  shopstack.common.v1.PageMeta meta = 2;
  int32 current_points = 3;
}

message Invoice {
  int64 id = 1;
  int64 user_id = 2;
  string order_no = 3;
  string title = 4;         // 发票抬头
  string tax_no = 5;        // 纳税人识别号
  string type = 6;          // personal / company
  string email = 7;
  int64 amount_cents = 8;
  int32 status = 9;         // 0 待开票 1 已开票 2 已驳回
  string invoice_url = 10;
  string remark = 11;
  google.protobuf.Timestamp created_at = 12;
}

message ListInvoicesRequest {
  int64 user_id = 1;
  shopstack.common.v1.PageRequest page = 2;
  int32 status = 3;
}

message SetInvoiceStatusRequest {
  int64 id = 1;
  int32 status = 2;        // 0 待开票 1 已开票 2 已驳回
  string invoice_url = 3;  // 开票后回填的电子发票地址
  string remark = 4;       // 驳回原因
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
  shopstack.common.v1.PageMeta meta = 2;
}

message CreateInvoiceRequest {
  int64 user_id = 1;
  string order_no = 2;
  string title = 3;
  string tax_no = 4;
  string type = 5;
  string email = 6;
  int64 amount_cents = 7;
  string remark = 8;
}

// ---------------------------------------------------------------------------
// 后台管理
// ---------------------------------------------------------------------------

message AdminLoginRequest {
  string username = 1;
  string password = 2;
}

message AdminListUsersRequest {
  shopstack.common.v1.PageRequest page = 1;
  string keyword = 2;
  int32 status = 3;
  int32 level = 10; // 按会员等级筛选
}

message AdminListUsersResponse {
  repeated User users = 1;
  shopstack.common.v1.PageMeta meta = 2;
}

message AdminUpdateUserStatusRequest {
  int64 user_id = 1;
  int32 status = 2;
  string reason = 3;
}

message AdminListRolesRequest {}

message AdminListRolesResponse {
  repeated Role roles = 1;
}

message SaveRoleRequest {
  int64 id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
  repeated int64 permission_ids = 5;
}

message DeleteRoleRequest {
  int64 id = 1;
}

message AdminListPermissionsRequest {}

message AdminListPermissionsResponse {
  repeated Permission permissions = 1;
}

message AdminUpdateProfileRequest {
  int64 admin_id = 1;
  string real_name = 2;
  string avatar = 3;
  string email = 4;
  string phone = 5;
}

message AdminDashboardOverviewRequest {
  int32 days = 1; // 统计周期，默认 30
}

message AdminDashboardOverviewResponse {
  int64 total_users = 1;
  int64 new_users = 2;
  int64 total_products = 3;
  int64 on_shelf_products = 4;
  int64 total_orders = 5;
  int64 pending_shipment = 6;
  int64 paid_orders = 7;
  int64 total_revenue_cents = 8;
  int64 today_revenue_cents = 9;
  int64 pending_refunds = 10;
  repeated AdminTrendPoint trend = 11;
  repeated AdminCategoryStat category_stats = 12;
  repeated AdminTopProduct top_products = 13;
}

message AdminTrendPoint {
  string date = 1;
  int64 order_count = 2;
  int64 revenue_cents = 3;
  int64 new_users = 4;
}

message AdminCategoryStat {
  int64 category_id = 1;
  string category_name = 2;
  int64 sales_count = 3;
  int64 revenue_cents = 4;
}

message AdminTopProduct {
  int64 product_id = 1;
  string title = 2;
  string cover = 3;
  int64 sales_count = 4;
  int64 revenue_cents = 5;
}

// ---------------------------------------------------------------------------
// 服务定义
// ---------------------------------------------------------------------------

service UserService {
  rpc Register(RegisterRequest) returns (AuthResponse) {
    option (google.api.http) = { post: "/api/v1/auth/register" body: "*" };
  }
  rpc Login(LoginRequest) returns (AuthResponse) {
    option (google.api.http) = { post: "/api/v1/auth/login" body: "*" };
  }
  rpc LoginWithWeChat(WeChatLoginRequest) returns (AuthResponse) {
    option (google.api.http) = { post: "/api/v1/auth/wechat" body: "*" };
  }
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse) {
    option (google.api.http) = { post: "/api/v1/auth/refresh" body: "*" };
  }
  rpc Logout(shopstack.common.v1.Empty) returns (shopstack.common.v1.OperationResult) {
    option (google.api.http) = { post: "/api/v1/auth/logout" body: "*" };
  }
  rpc GetProfile(GetProfileRequest) returns (User) {
    option (google.api.http) = { get: "/api/v1/users/me" };
  }
  rpc UpdateProfile(UpdateProfileRequest) returns (User) {
    option (google.api.http) = { put: "/api/v1/users/me" body: "*" };
  }
  rpc ChangePassword(ChangePasswordRequest) returns (shopstack.common.v1.OperationResult) {
    option (google.api.http) = { post: "/api/v1/users/password" body: "*" };
  }
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse) {
    option (google.api.http) = { get: "/api/v1/users/addresses" };
  }
  rpc SaveAddress(SaveAddressRequest) returns (shopstack.common.v1.Address) {
    option (google.api.http) = { post: "/api/v1/users/addresses" body: "*" };
  }
  rpc DeleteAddress(DeleteAddressRequest) returns (shopstack.common.v1.OperationResult) {
    option (google.api.http) = { delete: "/api/v1/users/addresses/{id}" };
  }
  rpc SetDefaultAddress(SetDefaultAddressRequest) returns (shopstack.common.v1.OperationResult) {
    option (google.api.http) = { put: "/api/v1/users/addresses/{id}/default" body: "*" };
  }
  rpc ListFavorites(ListFavoritesRequest) returns (ListFavoritesResponse) {
    option (google.api.http) = { get: "/api/v1/users/favorites" };
  }
  rpc ToggleFavorite(ToggleFavoriteRequest) returns (ToggleFavoriteResponse) {
    option (google.api.http) = { post: "/api/v1/users/favorites/toggle" body: "*" };
  }
  rpc ListPointsLogs(ListPointsLogsRequest) returns (ListPointsLogsResponse) {
    option (google.api.http) = { get: "/api/v1/users/points-logs" };
  }
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {
    option (google.api.http) = { get: "/api/v1/users/invoices" };
  }
  rpc CreateInvoice(CreateInvoiceRequest) returns (Invoice) {
    option (google.api.http) = { post: "/api/v1/users/invoices" body: "*" };
  }
  rpc GetUserLevel(GetUserLevelRequest) returns (UserLevelInfo) {
    option (google.api.http) = { get: "/api/v1/users/level" };
  }
  rpc ListUserLevels(ListUserLevelsRequest) returns (ListUserLevelsResponse) {
    option (google.api.http) = { get: "/api/v1/users/levels" };
  }
  rpc ListGrowthLogs(ListGrowthLogsRequest) returns (ListGrowthLogsResponse) {
    option (google.api.http) = { get: "/api/v1/users/growth-logs" };
  }
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse) {
    option (google.api.http) = { get: "/api/v1/regions" };
  }
  rpc ListInvoiceTemplates(ListInvoiceTemplatesRequest) returns (ListInvoiceTemplatesResponse) {
    option (google.api.http) = { get: "/api/v1/users/invoice-templates" };
  }
  rpc SaveInvoiceTemplate(SaveInvoiceTemplateRequest) returns (InvoiceTemplate) {
    option (google.api.http) = { post: "/api/v1/users/invoice-templates" body: "*" };
  }
  rpc DeleteInvoiceTemplate(DeleteInvoiceTemplateRequest) returns (shopstack.common.v1.OperationResult) {
    option (google.api.http) = { delete: "/api/v1/users/invoice-templates/{id}" };
  }
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (UserNotificationSettings) {
    option (google.api.http) = { get: "/api/v1/users/notification-settings" };
  }
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (UserNotificationSettings) {
    option (google.api.http) = { put: "/api/v1/users/notification-settings" body: "*" };
  }
  rpc GetAccountSecurity(GetAccountSecurityRequest) returns (AccountSecurityInfo) {
    option (google.api.http) = { get: "/api/v1/users/security" };
  }
  rpc RealNameAuth(RealNameAuthRequest) returns (User) {
    option (google.api.http) = { post: "/api/v1/users/realname" body: "*" };
  }
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (shopstack.common.v1.OperationResult) {
    option (google.api.http) = { post: "/api/v1/users/feedback" body: "*" };
  }
  rpc ListHelpArticles(ListHelpArticlesRequest) returns (ListHelpArticlesResponse) {
    option (google.api.http) = { get: "/api/v1/help/articles" };
  }
  rpc GetHelpArticle(GetHelpArticleRequest) returns (HelpArticle) {
    option (google.api.http) = { get: "/api/v1/help/articles/{id}" };
  }
}

service AdminService {
  rpc Login(AdminLoginRequest) returns (AuthResponse) {
    option (google.api.http) = { post: "/api/v1/admin/auth/login" body: "*" };
  }
  rpc GetProfile(GetProfileRequest) returns (Admin) {
    option (google.api.http) = { get: "/api/v1/admin/me" };
  }
  rpc UpdateProfile(AdminUpdateProfileRequest) returns (Admin) {
    option (google.api.http) = { put: "/api/v1/admin/me" body: "*" };
  }
  rpc ListUsers(AdminListUsersRequest) returns (AdminListUsersResponse) {
    option (google.api.http) = { get: "/api/v1/admin/users" };
  }
  rpc UpdateUserStatus(AdminUpdateUserStatusRequest) returns (shopstack.common.v1.OperationResult) {
    option (google.api.http) = { put: "/api/v1/admin/users/{user_id}/status" body: "*" };
  }
  rpc ListRoles(AdminListRolesRequest) returns (AdminListRolesResponse) {
    option (google.api.http) = { get: "/api/v1/admin/roles" };
  }
  rpc SaveRole(SaveRoleRequest) returns (Role) {
    option (google.api.http) = { post: "/api/v1/admin/roles" body: "*" };
  }
  rpc DeleteRole(DeleteRoleRequest) returns (shopstack.common.v1.OperationResult) {
    option (google.api.http) = { delete: "/api/v1/admin/roles/{id}" };
  }
  rpc ListPermissions(AdminListPermissionsRequest) returns (AdminListPermissionsResponse) {
    option (google.api.http) = { get: "/api/v1/admin/permissions" };
  }
  rpc DashboardOverview(AdminDashboardOverviewRequest) returns (AdminDashboardOverviewResponse) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard/overview" };
  }
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {
    option (google.api.http) = { get: "/api/v1/admin/invoices" };
  }
  rpc SetInvoiceStatus(SetInvoiceStatusRequest) returns (Invoice) {
    option (google.api.http) = { put: "/api/v1/admin/invoices/{id}/status" body: "*" };
  }
  rpc ListFeedbacks(ListFeedbacksRequest) returns (ListFeedbacksResponse) {
    option (google.api.http) = { get: "/api/v1/admin/feedbacks" };
  }
  rpc SetFeedbackStatus(SetFeedbackStatusRequest) returns (Feedback) {
    option (google.api.http) = { put: "/api/v1/admin/feedbacks/{id}/status" body: "*" };
  }
  rpc SaveUserLevel(SaveUserLevelRequest) returns (UserLevel) {
    option (google.api.http) = { post: "/api/v1/admin/user-levels" body: "*" };
  }
}

// EXTRA_MARKER: 由 scripts/extend-proto.py 追加的消息定义

// ---------------------------------------------------------------------------
// 会员等级与成长值
// ---------------------------------------------------------------------------

message UserLevel {
  int64 id = 1;
  string name = 2;
  int32 level = 3;
  int32 min_growth = 4;
  int32 max_growth = 5;
  int32 discount_percent = 6; // 折扣百分比，100 表示无折扣
  string icon = 7;
  string description = 8;
  repeated string benefits = 9;
  int32 sort = 10;
}

message GetUserLevelRequest {
  int64 user_id = 1;
}

message UserLevelInfo {
  int32 level = 1;
  string level_name = 2;
  int32 growth = 3;
  int32 current_min_growth = 4;
  int32 next_min_growth = 5;
  int32 growth_to_next = 6;
  int32 discount_percent = 7;
  string next_level_name = 8;
  repeated UserLevel levels = 9;
}

message ListUserLevelsRequest {}

message ListUserLevelsResponse {
  repeated UserLevel levels = 1;
}

message ListGrowthLogsRequest {
  int64 user_id = 1;
  shopstack.common.v1.PageRequest page = 2;
}

message GrowthLog {
  int64 id = 1;
  int64 user_id = 2;
  int32 change = 3;
  int32 balance = 4;
  string title = 5;
  string biz_type = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListGrowthLogsResponse {
  repeated GrowthLog logs = 1;
  shopstack.common.v1.PageMeta meta = 2;
  int32 current_growth = 3;
}

message SaveUserLevelRequest {
  int64 id = 1;
  string name = 2;
  int32 level = 3;
  int32 min_growth = 4;
  int32 max_growth = 5;
  int32 discount_percent = 6;
  string icon = 7;
  string description = 8;
  repeated string benefits = 9;
  int32 sort = 10;
}

// ---------------------------------------------------------------------------
// 行政区域
// ---------------------------------------------------------------------------

message Region {
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  string code = 4;
  int32 level = 5; // 1 省 2 市 3 区
  int32 sort = 6;
}

message ListRegionsRequest {
  int64 parent_id = 1;
  bool tree = 2;
}

message ListRegionsResponse {
  repeated Region regions = 1;
}

// ---------------------------------------------------------------------------
// 发票抬头模板
// ---------------------------------------------------------------------------

message InvoiceTemplate {
  int64 id = 1;
  int64 user_id = 2;
  string title = 3;
  string tax_no = 4;
  string type = 5; // personal | company
  string email = 6;
  string phone = 7;
  string address = 8;
  string bank_name = 9;
  string bank_account = 10;
  bool is_default = 11;
  google.protobuf.Timestamp created_at = 12;
}

message ListInvoiceTemplatesRequest {
  int64 user_id = 1;
}

message ListInvoiceTemplatesResponse {
  repeated InvoiceTemplate templates = 1;
}

message SaveInvoiceTemplateRequest {
  int64 id = 1;
  string title = 2;
  string tax_no = 3;
  string type = 4;
  string email = 5;
  string phone = 6;
  string address = 7;
  string bank_name = 8;
  string bank_account = 9;
  bool is_default = 10;
}

message DeleteInvoiceTemplateRequest {
  int64 id = 1;
}

// ---------------------------------------------------------------------------
// 通知订阅偏好
// ---------------------------------------------------------------------------

message UserNotificationSettings {
  int64 user_id = 1;
  bool order_notice = 2;
  bool logistics_notice = 3;
  bool marketing_notice = 4;
  bool system_notice = 5;
  bool sms_notice = 6;
  bool email_notice = 7;
  bool wechat_notice = 8;
}

message GetNotificationSettingsRequest {
  int64 user_id = 1;
}

message UpdateNotificationSettingsRequest {
  int64 user_id = 1;
  bool order_notice = 2;
  bool logistics_notice = 3;
  bool marketing_notice = 4;
  bool system_notice = 5;
  bool sms_notice = 6;
  bool email_notice = 7;
  bool wechat_notice = 8;
}

// ---------------------------------------------------------------------------
// 账号安全
// ---------------------------------------------------------------------------

message GetAccountSecurityRequest {
  int64 user_id = 1;
}

message AccountSecurityInfo {
  bool phone_bound = 1;
  bool email_bound = 2;
  bool wechat_bound = 3;
  bool realname_verified = 4;
  int32 risk_level = 5; // 0 安全 1 中 2 高
  google.protobuf.Timestamp password_changed_at = 6;
  repeated string warnings = 7;
}

message RealNameAuthRequest {
  string real_name = 1;
  string id_card = 2;
}

// ---------------------------------------------------------------------------
// 意见反馈
// ---------------------------------------------------------------------------

message SubmitFeedbackRequest {
  int32 type = 1; // 1 功能建议 2 使用问题 3 投诉 4 其他
  string content = 2;
  repeated string images = 3;
  string contact = 4;
}

message Feedback {
  int64 id = 1;
  int64 user_id = 2;
  string user_nickname = 3;
  int32 type = 4;
  string content = 5;
  repeated string images = 6;
  string contact = 7;
  int32 status = 8; // 0 待处理 1 处理中 2 已处理 3 已关闭
  string reply = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp processed_at = 11;
}

message ListFeedbacksRequest {
  shopstack.common.v1.PageRequest page = 1;
  int32 status = 2;
  string keyword = 3;
}

message ListFeedbacksResponse {
  repeated Feedback feedbacks = 1;
  shopstack.common.v1.PageMeta meta = 2;
}

message SetFeedbackStatusRequest {
  int64 id = 1;
  int32 status = 2;
  string reply = 3;
}

// ---------------------------------------------------------------------------
// 帮助中心
// ---------------------------------------------------------------------------

message HelpArticle {
  int64 id = 1;
  int64 category_id = 2;
  string category_name = 3;
  string title = 4;
  string content = 5;
  int32 sort = 6;
  bool enabled = 7;
  int32 view_count = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListHelpArticlesRequest {
  int64 category_id = 1;
  shopstack.common.v1.PageRequest page = 2;
  string keyword = 3;
}

message ListHelpArticlesResponse {
  repeated HelpArticle articles = 1;
  shopstack.common.v1.PageMeta meta = 2;
}

message GetHelpArticleRequest {
  int64 id = 1;
}
