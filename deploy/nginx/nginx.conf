# ===========================================================================
# ShopStack 网关反向代理
# ---------------------------------------------------------------------------
# 用法：
#   docker run -d --name shopstack-nginx -p 80:80 \
#     -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
#     -v "$PWD/deploy/nginx/html:/usr/share/nginx/html:ro" \
#     nginx:1.27-alpine
#
# 生产环境把 TLS 证书挂到 /etc/nginx/certs，在 443 server 段启用。
# ===========================================================================

upstream shopstack_gateway {
    # 网关服务名（compose 里叫 api-gateway）
    server api-gateway:8080;
    keepalive 64;
}

# ---------------------------------------------------------------------------
# HTTP —— 生产环境建议直接跳转到 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # 允许前端开发时的跨域直连
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://shopstack_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # 健康检查不记访问日志
    location = /healthz {
        proxy_pass       http://shopstack_gateway;
        access_log      off;
    }

    location = /readyz {
        proxy_pass       http://shopstack_gateway;
        access_log      off;
    }
}

